<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BorrowBox — Lend it. Borrow it. Track it.</title>
    <meta name="description" content="BorrowBox is a community platform to lend and borrow tools and equipment with clear dates, condition tracking and trust scores." />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Sora"', 'sans-serif'],
            },
            colors: {
              navy: '#012894',
              brand: '#1E8FD5',
              teal: '#0E9F9A',
              indigo: '#5B4BC4',
            },
            boxShadow: {
              soft: '0 10px 30px -12px rgba(1, 40, 148, 0.25)',
              card: '0 4px 18px -6px rgba(1, 40, 148, 0.15)',
            },
          },
        },
      };
    </script>
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f6f8fc; }
      .font-display { font-family: 'Sora', sans-serif; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 8px; }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fadeInUp { animation: fadeInUp .45s ease both; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
